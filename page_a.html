<!DOCTYPE html>
<html lang="en">
<!-- Head Section -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Monomaniac+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- css แบบ Internal Style -->
    <style>
        body {
            background-color: #000000;
            margin: 0;
            padding: 0;
        }

        a {
            color: #ffffff;
            text-decoration: none;
            font-size: 20px;
        }

        .menu a {
            font-family: 'Monomaniac One'
        }

        .nav-bar {
            display: flex;
            align-items: center;
            margin: 75px 150px;
        }

        .menu,
        .logo,
        .icon {
            width: 100%;
            display: flex;
        }

        .menu {
            justify-content: start;
            gap: 50px;
        }

        .logo {

            justify-content: center;
        }

        .icon {
            justify-content: end;
            gap: 30px;
        }

        a:hover {
            color: #01d5a2;
        }
        span{
            font-family: 'Monomaniac One';
            color: #ffffff;
            font-size: 3rem;
        }
        .p-job span{
            color: #01d5a2;
        }
        .profile-info{
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 120px;
        }
        .profile-picture{
            display: flex;
            justify-content: center;
            margin-top: 100px;
        }
        .profile-picture img{
            width: 280px;
            border: 2px solid #01d5a2;
            border-radius: 100%;
            padding: 20px;
        }
    </style>
</head>
<!-- Body Section -->

<body>
    <!-- ส่วนของ nav-bar -->
    <div class="nav-bar">
        <!-- ส่วนของ menu -->
        <div class="menu">
            <a href="">Protfolio</a>
            <a href="">About Me</a>
            <a href="">Get In Touch</a>
        </div>
        <!-- ส่วนของ logo -->
        <div class="logo">
            <img src="./images/a1.png" alt="" />
        </div>
        <!-- ส่วนของ icon -->
        <div class="icon">
            <a href=""><i class="bi bi-github"></i></a>
            <a href=""><i class="bi bi-instagram"></i></a>
            <a href=""><i class="bi bi-twitter"></i></a>
            <a href=""><i class="bi bi-linkedin"></i></a>
        </div>
    </div>
    <!-- ส่วนของ profile-info -->
    <div class="profile-info">
        <div class="profile-info">
            <div class="p-name">
                <span>Rachaporn Chanyapat</span>
            </div>
            <div class="p-job">
                <span>Freelance Web Developer</span>
            </div>
            <div class="p-state">
                <span>Based in Thailand</span>
            </div>

        </div>
    </div>

    <!-- ส่วนของ profile-picture -->
    <div class="profile-picture">
        <img src="./images/a2.png" alt="a1">
    </div>
</body>
</html>
