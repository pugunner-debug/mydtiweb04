<!DOCTYPE html>
<html lang="en">
<!-- Head Section -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pugunner 2026</title>
    
    <!-- 🔤 ดึงฟอนต์ Monomaniac One มาใช้ -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Monomaniac+One&display=swap" rel="stylesheet">
    <!-- 🌟 ดึงไอคอน Bootstrap มาใช้ -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    
    <!-- 🎨 css แบบ Internal Style -->
    <style>
        /* 📦 ล้างค่าพื้นฐาน กันขอบโผล่ */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* 🔒 ล็อกหน้าจอให้พอดี 100% ไม่ให้มีแถบเลื่อน (Scrollbar) */
        html, body {
            width: 100%;
            height: 100%; 
            overflow: hidden; /* ซ่อนส่วนที่ล้นหน้าจอ */
        }

        body {
            background-color: #000000;
            display: flex;
            flex-direction: column; /* จัดเรียงเนื้อหาจากบนลงล่าง */
            justify-content: flex-start; /* เริ่มเนื้อหาจากด้านบน */
        }

        /* 🔗 สไตล์สำหรับลิงก์ */
        a {
            color: #ffffff;
            text-decoration: none;
            font-size: clamp(14px, 1.5vw, 20px); /* ย่อ/ขยายฟอนต์ตามจอ */
            transition: color 0.3s ease; /* ให้ตอนชี้เมาส์สีค่อยๆ เปลี่ยน */
        }
        a:hover {
            color: #01d5a2;
        }

        .menu a {
            font-family: 'Monomaniac One', sans-serif;
        }

        /* 🧭 แถบนำทางด้านบน (Navbar) */
        .nav-bar {
            display: flex;
            align-items: center;
            justify-content: space-between; /* กระจาย 3 ส่วนให้ห่างกัน */
            padding: 30px 5%; /* ใช้ padding แทน margin เพื่อให้รองรับมือถือ */
            width: 100%;
            max-width: 1200px; /* จำกัดความกว้างสูงสุด */
            margin: 0 auto; /* จัดกึ่งกลางจอ */
            height: 15%; /* กำหนดความสูงให้ Navbar */
        }

        /* 📱 ปรับแต่ง 3 ส่วนใน Navbar */
        .menu, .logo, .icon {
            display: flex;
            align-items: center;
            flex: 1; /* ให้ทั้ง 3 ส่วนแบ่งพื้นที่เท่าๆ กัน */
        }

        .menu {
            justify-content: flex-start;
            gap: clamp(15px, 3vw, 50px); /* ระยะห่างลิงก์ ยืดหยุ่นตามจอ */
        }

        .logo {
            justify-content: center;
        }
        
        .logo img {
            max-height: 50px; /* คุมขนาดโลโก้ไม่ให้ใหญ่เกิน */
            width: auto;
        }

        .icon {
            justify-content: flex-end;
            gap: clamp(10px, 2vw, 30px); /* ระยะห่างไอคอน ยืดหยุ่นตามจอ */
        }

        /* 📝 ส่วนข้อความแนะนำตัวตรงกลาง */
        .profile-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1; /* สำคัญ! ให้ส่วนนี้ขยายเต็มพื้นที่ที่เหลือ (ดันรูปไปด้านล่าง) */
            padding: 20px;
        }

        /* 🔠 ปรับขนาดฟอนต์ข้อความ */
        span {
            font-family: 'Monomaniac One', sans-serif;
            color: #ffffff;
            font-size: clamp(1.8rem, 4vw, 3rem); /* ฟอนต์ยืดหยุ่น ย่อตามมือถือ */
            text-align: center; /* จัดข้อความให้อยู่ตรงกลาง */
            display: block; /* ให้ข้อความลงบรรทัดใหม่ */
            margin-bottom: 10px; /* เว้นระยะห่างแต่ละบรรทัดนิดนึง */
        }

        .p-job span {
            color: #01d5a2;
        }

        /* 📸 ส่วนรูปโปรไฟล์ด้านล่าง */
        .profile-picture {
            display: flex;
            justify-content: center;
            align-items: flex-end; /* ดันรูปลงขอบล่างของกล่อง */
            height: 40%; /* กำหนดความสูงให้รูปภาพ เพื่อไม่ให้ดันส่วนอื่น */
            padding-bottom: 20px; /* เว้นจากขอบล่างจอนิดนึง */
        }

        .profile-picture img {
            height: 100%; /* ให้รูปสูงพอดีกับพื้นที่ที่กำหนด */
            max-height: 320px; /* จำกัดความสูงสูงสุด */
            width: auto; /* ให้กว้างตามสัดส่วน */
            border: 2px solid #01d5a2;
            border-radius: 100%; /* ทำให้รูปเป็นวงกลม */
            padding: clamp(10px, 2vw, 20px); /* ขอบรอบรูป ยืดหยุ่นตามจอ */
            object-fit: cover; /* ตัดรูปให้เต็มวงกลมพอดี */
            aspect-ratio: 1 / 1; /* บังคับให้เป็นสี่เหลี่ยมจัตุรัสเสมอ (วงกลมสมบูรณ์) */
        }

        /* 🌟 เวทมนตร์ของพู่: จัดการมือถือให้ดูดีสุดๆ */
        @media (max-width: 768px) {
            /* 🔓 ปลดล็อกให้เลื่อนได้บนมือถือ ถ้าเนื้อหายาวเกินจอ */
            html, body {
                overflow: auto;
                height: auto;
                min-height: 100vh;
            }
            
            /* ปรับ Navbar บนมือถือให้เป็นแนวตั้ง เรียงลงมา */
            .nav-bar {
                flex-direction: column;
                height: auto;
                gap: 20px; /* เว้นระยะแต่ละส่วน */
                padding: 20px;
            }
            
            .menu, .logo, .icon {
                justify-content: center; /* จัดให้อยู่ตรงกลางหมดเลย */
                width: 100%;
            }
            
            .profile-picture {
                height: 300px; /* กำหนดความสูงคงที่บนมือถือ */
                margin-top: 30px;
            }
        }
    </style>
</head>
<!-- Body Section -->

<body>
    <!-- 🧭 แถบนำทางด้านบน -->
    <div class="nav-bar">
        <!-- 📝 เมนูด้านซ้าย -->
        <div class="menu">
            <a href="">Portfolio</a>
            <a href="">About Me</a>
            <a href="">Get In Touch</a>
        </div>
        <!-- ✨ โลโก้ตรงกลาง (อย่าลืมเปลี่ยน path รูปนะ) -->
        <div class="logo">
            <img src="./images/a1.png" alt="Logo" />
        </div>
        <!-- 📱 ไอคอนโซเชียลด้านขวา -->
        <div class="icon">
            <a href=""><i class="bi bi-github"></i></a>
            <a href=""><i class="bi bi-instagram"></i></a>
            <a href=""><i class="bi bi-twitter"></i></a>
            <a href=""><i class="bi bi-linkedin"></i></a>
        </div>
    </div>

    <!-- 👤 ข้อความแนะนำตัว (อยู่ตรงกลางจอ) -->
    <div class="profile-container">
        <div class="p-name">
            <span>Rachaporn Chanyapat</span>
        </div>
        <div class="p-job">
            <span>Freelance Web Developer</span>
        </div>
        <div class="p-state">
            <span>Based in Thailand</span>
        </div>
    </div>

    <!-- 📸 รูปโปรไฟล์ (อยู่ด้านล่างสุด) -->
    <div class="profile-picture">
        <img src="./images/a2.jpg" alt="Profile Picture">
    </div>
</body>
</html>
